[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepclaw"
version = "0.1.0"
description = "A local AI agent powered by DeepSeek — reads, writes, executes, and browses the web from your terminal."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "DeepClaw Contributors" },
]
keywords = [
    "ai-agent",
    "deepseek",
    "cli",
    "terminal",
    "llm",
    "coding-assistant",
    "ai",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Terminals",
    "Environment :: Console",
]
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "rich>=13.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "tavily-python>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/boyin111-1/DeepClaw"
Repository = "https://github.com/boyin111-1/DeepClaw"
Issues = "https://github.com/boyin111-1/DeepClaw/issues"

[project.scripts]
deepclaw = "deepclaw.main:main"

[tool.setuptools.packages.find]
include = ["deepclaw*"]
